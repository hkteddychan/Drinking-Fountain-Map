name: Update Drinking Fountain Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Fetch latest data from CSDI
        run: |
          DATASET_ID="epd_rcd_1638154342238_45289"
          API="https://portal.csdi.gov.hk/server/rest/services/common/${DATASET_ID}/FeatureServer/0/query"

          curl -s "$API?where=1%3D1&outFields=*&f=json&outSR=4326" \
            -H "User-Agent: Mozilla/5.0" \
            -o raw_data.json

          echo "Fetched raw data"

      - name: Convert to GeoJSON
        run: |
          node -e "
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('raw_data.json', 'utf8'));
          const features = data.features.map(f => ({
            type: 'Feature',
            geometry: {
              type: 'Point',
              coordinates: [f.attributes.Longitude, f.attributes.Latitude]
            },
            properties: {
              name_tc: f.attributes.NameTC,
              name_en: f.attributes.NameEN,
              address_tc: f.attributes.AddressTC,
              address_en: f.attributes.AddressEN,
              district_tc: f.attributes.DistrictTC,
              district_en: f.attributes.DistrictEN,
              type: f.attributes.VenueTypeTC,
              last_update: f.attributes.LastUpdate ? new Date(f.attributes.LastUpdate).toISOString() : null
            }
          }));
          const geojson = { type: 'FeatureCollection', features };
          fs.writeFileSync('data.json', JSON.stringify(geojson, null, 0));
          console.log('Converted', features.length, 'features');
          "

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json raw_data.json
            git commit -m "chore: auto-update drinking fountain data"
            git push origin main
            echo "Pushed data update"
          else
            echo "No data change"
          fi